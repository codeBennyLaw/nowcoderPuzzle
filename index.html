<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>牛客娘拼图大作战</title>
    <link rel="preload" as="fetch" href="assets/images/puzzle/manifest.json" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header class="app-header">
        <h1>拼图游戏</h1>
        <div class="controls">
            <div class="control-group">
                <label>模式：</label>
                <label><input type="radio" name="mode" value="classic" checked> 经典拖拽</label>
                <label><input type="radio" name="mode" value="sliding"> 滑块拼图</label>
            </div>
            <div class="control-group" id="difficultyGroup">
                <label for="difficulty">难度：</label>
                <select id="difficulty">
                    <option value="3">3 × 3</option>
                    <option value="4">4 × 4</option>
                    <option value="5">5 × 5</option>
                </select>
            </div>
            <div class="control-group">
                <label for="imageSelect">图片：</label>
                <button id="prevImage" title="上一张">◀</button>
                <select id="imageSelect"></select>
                <button id="nextImage" title="下一张">▶</button>
            </div>
            <div class="control-group">
                <button id="restart">重新开始</button>
            </div>
            <div class="control-group">
                <label><input type="checkbox" id="timerToggle" /> 计时</label>
                <span id="timeDisplay">00:00</span>
                <span id="stepDisplay">步数：0</span>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div id="boardWrapper">
            <div id="board" class="board" aria-label="拼图棋盘"></div>
        </div>
    </main>

    <!-- 右下角悬浮窗口（随机 GIF，不可关闭） -->
    <div id="floatBox" class="float-box" aria-label="趣味悬浮图">
        <img id="floatGif" alt="悬浮动图" decoding="async" />
    </div>

    <!-- 完成弹窗（展示 ac.png 并播放 ac.wav） -->
    <div id="acModal" class="modal" hidden>
        <div class="modal-content">
            <button id="acClose" class="modal-close" aria-label="关闭">×</button>
            <img id="acImage" alt="通关奖励" loading="lazy" decoding="async" />
            <div class="modal-actions">
                <button id="viewOriginal">查看原图</button>
            </div>
        </div>
    </div>

    <footer class="app-footer" aria-label="页脚">
        <div class="footer-line">
            <a class="github-btn" href="https://github.com/codeBennyLaw/nowcoderPuzzle" target="_blank"
                rel="noopener">GitHub</a>
        </div>
        <div class="footer-line">Powered by AliLexiWalker&GPT5</div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
